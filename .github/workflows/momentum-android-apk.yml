name: Momentum Android APK

on:
  push:
    branches: [claude/momentum-local-first-app-i5yhju]
    # Docs-only changes (e.g. IDEAS.md) don't need a new APK.
    paths: ['momentum/**', '!momentum/**/*.md', '.github/workflows/momentum-android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: momentum
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: momentum/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx jest

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          # Increases every build so each APK installs as an update over the last.
          ANDROID_VERSION_CODE: ${{ github.run_number }}

      - name: Verify signing key is unchanged
        # Every Momentum APK so far is signed with this key. If it ever changes,
        # Android refuses the update and users would have to uninstall — which
        # deletes all local data. Fail loudly instead of shipping that.
        run: |
          echo "${EXPECTED_KEYSTORE_SHA256}  android/app/debug.keystore" | sha256sum --check
        env:
          EXPECTED_KEYSTORE_SHA256: 221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58

      - name: Install Android NDK (with retries)
        # Gradle's on-the-fly NDK download occasionally fails on hosted runners;
        # installing it up front with retries makes builds reliable.
        run: |
          NDK_VERSION=$(grep -E '^ndkVersion' node_modules/react-native/gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "NDK $NDK_VERSION"
          for attempt in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Build release APK
        working-directory: momentum/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/momentum-${{ github.run_number }}.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: momentum-apk
          path: momentum/dist/*.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: momentum-build-${{ github.run_number }}
          name: Momentum APK (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Android APK for Momentum, built from ${{ github.sha }}.
            Download `momentum-${{ github.run_number }}.apk` on your phone and allow "Install unknown apps".
            Signed with the debug key (for testing, not Play Store).
          files: momentum/dist/*.apk
