name: Gamebook Windows EXE

on:
  push:
    branches: [main, claude/compassionate-einstein-ljsfzb]
    paths: ['gamebook/**', '!gamebook/**/*.md', '.github/workflows/gamebook-windows-exe.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamebook-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
        working-directory: gamebook
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate story
        run: python validate.py

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --console --name ShadowCrown --add-data "story;story" main.py

      - name: Smoke test
        # Opens the main menu and picks "5" (exit). Fails if the EXE can't start or find the story.
        run: |
          printf '5\n' | ./dist/ShadowCrown.exe --no-rtl > out.txt
          cat out.txt
          grep -q "5\." out.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ShadowCrown-exe
          path: gamebook/dist/ShadowCrown.exe

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamebook-build-${{ github.run_number }}
          name: Shadow Crown gamebook for Windows (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            "כתר מלך-הצללים" - ספר-משחק לטרמינל. בנוי מ-${{ github.sha }}.
            מורידים את `ShadowCrown.exe` ומריצים בלחיצה כפולה. לא צריך Python.
            Windows עלול להזהיר שהקובץ לא מוכר: לוחצים "More info" ואז "Run anyway".
          files: gamebook/dist/ShadowCrown.exe
